<!doctype html><html><head>
<meta charset="utf-8"><title>Type weights</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <p class="card-title">Type</p>
  <h2 class="card-heading">Roboto — weight vocabulary</h2>

  <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; max-width:1100px">
    <div style="border:1px solid var(--divider); border-radius:8px; padding:22px">
      <div style="font:300 48px/1.1 'Roboto', sans-serif; color:var(--fg-primary); margin-bottom:8px">Aa</div>
      <div style="font:500 13px/1.4 'Roboto', sans-serif">Light · 300</div>
      <div class="label-mono" style="margin-top:4px">h1, h2 only</div>
    </div>
    <div style="border:1px solid var(--divider); border-radius:8px; padding:22px">
      <div style="font:400 48px/1.1 'Roboto', sans-serif; color:var(--fg-primary); margin-bottom:8px">Aa</div>
      <div style="font:500 13px/1.4 'Roboto', sans-serif">Regular · 400</div>
      <div class="label-mono" style="margin-top:4px">body, h3, h4, h5</div>
    </div>
    <div style="border:1px solid var(--divider); border-radius:8px; padding:22px">
      <div style="font:500 48px/1.1 'Roboto', sans-serif; color:var(--fg-primary); margin-bottom:8px">Aa</div>
      <div style="font:500 13px/1.4 'Roboto', sans-serif">Medium · 500</div>
      <div class="label-mono" style="margin-top:4px">h6, subtitle, button</div>
    </div>
    <div style="border:1px solid var(--divider); border-radius:8px; padding:22px">
      <div style="font:700 48px/1.1 'Roboto', sans-serif; color:var(--fg-primary); margin-bottom:8px">Aa</div>
      <div style="font:500 13px/1.4 'Roboto', sans-serif">Bold · 700</div>
      <div class="label-mono" style="margin-top:4px">Section titles — workhorse</div>
    </div>
  </div>

  <div class="card-section" style="margin-top:32px">
    <p class="card-title" style="margin-bottom:12px">Glyph sample</p>
    <div style="font:400 32px/1.3 'Roboto', sans-serif; max-width:920px">
      The quick brown fox jumps over the lazy dog.<br>
      <span style="color:var(--fg-secondary); font-size:24px">abcdefghijklmnopqrstuvwxyz · 0123456789 · àéïöñç · <em>italic</em> · <strong>bold</strong></span>
    </div>
  </div>
</div>
</body></html>
