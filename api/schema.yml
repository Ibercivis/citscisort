    Challenge:
      type: object
      description: |-
        A participable Reto/Challenge with its stats.

        `stats` is read from `context['stats_map']` when present (batched by the
        catalog endpoint); otherwise it is computed live for the single object —
        which also includes `my_contributions` for the requesting user.
        `is_participating` likewise uses `context['participating_ids']` when batched.
      properties:
        id:
          type: integer
          readOnly: true
        challenge_type:
          $ref: '#/components/schemas/ChallengeTypeEnum'
        challenge_type_display:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
          pattern: ^[-a-zA-Z0-9_]+$
        keyword_label:
          type: string
          readOnly: true
        keyword_slug:
          type: string
          readOnly: true
        wos_category_label:
          type: string
          readOnly: true
        wos_category_slug:
          type: string
          readOnly: true
        journal_name:
          type: string
          description: Set when challenge_type='journal' (matches Abstract.journal
            exactly)
          maxLength: 500
        stats:
          type: string
          readOnly: true
        is_participating:
          type: string
          readOnly: true
      required:
      - challenge_type
      - challenge_type_display
      - id
      - is_participating
      - keyword_label
      - keyword_slug
      - slug
      - stats
      - title
      - wos_category_label
      - wos_category_slug
    ChallengeRequest:
      type: object
      description: |-
