          maxLength: 100
        show_if_parent_category:
          type: integer
          nullable: true
        show_if_parent_values: {}
        children:
          type: string
          readOnly: true
        ioannidis_pillar:
          allOf:
          - $ref: '#/components/schemas/IoannidisPillarEnum'
          description: |-
            Mapping to Ioannidis et al. 2015 meta-research pillars (Harpe 2021 adds Organization)

            * `none` - Not applicable
            * `methods` - Methods
            * `reporting` - Reporting
            * `reproducibility` - Reproducibility
            * `evaluation` - Evaluation
            * `incentives` - Incentives
            * `organization` - Organization (Harpe 2021)
        ioannidis_pillar_display:
          type: string
          readOnly: true
        rri_key:
          allOf:
          - $ref: '#/components/schemas/RriKeyEnum'
          description: |-
            Mapping to Responsible Research and Innovation keys (Stilgoe et al. 2013; Horizon 2020)

            * `none` - Not applicable
            * `ethics` - Ethics
            * `public_engagement` - Public Engagement
            * `gender_equality` - Gender Equality
            * `science_education` - Science Education
            * `open_access` - Open Access
            * `governance` - Governance
        rri_key_display:
          type: string
          readOnly: true
        reference:
          type: string
          description: Bibliographic justification for this category
      required:
      - category_type
      - children
      - code
      - id
      - ioannidis_pillar_display
      - name
      - parent_name
      - rri_key_display
