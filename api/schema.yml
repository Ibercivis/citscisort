          type: string
          description: 'Concise headline: what the category studies'
          maxLength: 300
        keywords:
          description: List of topic keywords that belong to this category
        disambiguation:
          type: string
          description: Decision rules when this category overlaps with others
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_active:
          type: boolean
        allows_multiple:
          type: boolean
