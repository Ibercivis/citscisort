openapi: 3.0.3
info:
  title: CitSciSort API
  version: 1.0.0
  description: API for the citizen science classification platform CitSciSort
paths:
  /api/abstracts/:
    get:
      operationId: abstracts_list
      description: |-
        Cache the list response when it does NOT vary by user
        (i.e. `exclude_mine` is absent). Per-user queries bypass the cache.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - abstracts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAbstractListList'
          description: ''
    post:
      operationId: abstracts_create
      description: ViewSet for abstracts
      tags:
      - abstracts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbstractRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbstractRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbstractRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
  /api/abstracts/{id}/:
    get:
      operationId: abstracts_retrieve
      description: ViewSet for abstracts
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Abstract.
        required: true
      tags:
      - abstracts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
    put:
      operationId: abstracts_update
      description: ViewSet for abstracts
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Abstract.
        required: true
      tags:
      - abstracts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbstractRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbstractRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbstractRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
    patch:
      operationId: abstracts_partial_update
      description: ViewSet for abstracts
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Abstract.
        required: true
      tags:
      - abstracts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAbstractRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAbstractRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAbstractRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
    delete:
      operationId: abstracts_destroy
      description: ViewSet for abstracts
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Abstract.
        required: true
      tags:
      - abstracts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/abstracts/most_shared/:
    get:
      operationId: abstracts_most_shared_retrieve
      description: |-
        Get most shared abstracts (community statistics)
        GET /api/abstracts/most_shared/?limit=10
      tags:
      - abstracts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
  /api/abstracts/my_shared/:
    get:
      operationId: abstracts_my_shared_retrieve
      description: |-
        Get list of abstracts I have shared
        GET /api/abstracts/my_shared/
      tags:
      - abstracts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
  /api/abstracts/share/:
    post:
      operationId: abstracts_share_create
      description: Share an abstract via email. Requires abstract_id, recipient_email,
        and optional message.
      tags:
      - abstracts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareAbstractRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShareAbstractRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShareAbstractRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  shared_id:
                    type: integer
                  shared_at:
                    type: string
                    format: date-time
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
          description: ''
  /api/abstracts/statistics/:
    get:
      operationId: abstracts_statistics_retrieve
      description: Get overall statistics about abstracts
      tags:
      - abstracts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abstract'
          description: ''
  /api/auth/accept-legal/:
    post:
      operationId: auth_accept_legal_create
      description: |-
        POST /api/auth/accept-legal/

        Record the user's acceptance of the current Terms of Service and Privacy
        Policy versions.

        Body (all fields required):
            {
              "terms_version": "April 2026",
              "privacy_version": "April 2026"
            }

        The versions must match settings.CURRENT_TERMS_VERSION and
        settings.CURRENT_PRIVACY_VERSION byte-for-byte; otherwise the request is
        rejected with 400. This prevents a stale frontend from accepting an old
        version.

        Response: same shape as GET /api/auth/legal-status/ (with updated state).
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        GET /api/auth/csrf/

        Anonymous endpoint that sets the csrftoken cookie on the client.
        Frontends call this before unauthenticated POSTs (register, password reset,
        email verification confirm) so the cookie exists when they send the token.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/delete-account/:
    delete:
      operationId: auth_delete_account_destroy
      description: Handle account deletion
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        POST /api/auth/google/

        Accepts a Google access_token or id_token from the frontend
        and returns an auth token for the API.

        Request body:
            {"access_token": "<google_access_token>"}
            or
            {"id_token": "<google_id_token>"}
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLogin'
          description: ''
  /api/auth/legal-status/:
    get:
      operationId: auth_legal_status_retrieve
      description: |-
        GET /api/auth/legal-status/

        Returns the user's Terms/Privacy acceptance state and the current versions.
        The frontend calls this right after any successful login; if
        `needs_acceptance` is true, it must show the acceptance modal and then
        POST to /api/auth/accept-legal/.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Check the credentials and return the REST Token
        if the credentials are valid and authenticated.
        Calls Django Auth login method to register User ID
        in Django session framework

        Accept the following POST parameters: username, password
        Return the REST Framework Token Object's key.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomLoginRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Calls Django logout method and delete the Token object
        assigned to the current User object.

        Accepts/Returns nothing.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Calls Django Auth SetPasswordForm save method.

        Accepts the following POST parameters: new_password1, new_password2
        Returns the success/fail message.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Calls Django Auth PasswordResetForm save method.

        Accepts the following POST parameters: email
        Returns the success/fail message.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomPasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomPasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomPasswordResetRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        Password reset e-mail link is confirmed, therefore
        this resets the user's password.

        Accepts the following POST parameters: token, uid,
            new_password1, new_password2
        Returns the success/fail message.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/registration/:
    post:
      operationId: auth_registration_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/registration/resend-email/:
    post:
      operationId: auth_registration_resend_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/registration/verify-email/:
    post:
      operationId: auth_registration_verify_email_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/user/:
    get:
      operationId: auth_user_retrieve
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
    put:
      operationId: auth_user_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetailsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetailsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetailsRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
    patch:
      operationId: auth_user_partial_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailsRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: |-
        ViewSet for categories - READ ONLY, NO AUTHENTICATION REQUIRED
        list: Get all active categories
        retrieve: Get a specific category
        by_type: Get categories by type
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - categories
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryListList'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: |-
        ViewSet for categories - READ ONLY, NO AUTHENTICATION REQUIRED
        list: Get all active categories
        retrieve: Get a specific category
        by_type: Get categories by type
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este category.
        required: true
      tags:
      - categories
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/by_type/:
    get:
      operationId: categories_by_type_retrieve
      description: Get categories grouped by type
      tags:
      - categories
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
          description: ''
  /api/categories/classification_flow/:
    get:
      operationId: categories_classification_flow_retrieve
      description: Get the complete classification flow with conditional logic
      tags:
      - categories
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/challenges/:
    get:
      operationId: challenges_list
      description: |-
        Reto/Challenge catalog: the General challenge + top-N keyword and journal
        challenges. A challenge is a lens over the global corpus, so its stats are a
        subset of the general ones and a single classification counts everywhere.

        - GET  /challenges/                list the catalog (filter with ?type=keyword|journal|general)
        - GET  /challenges/{id}/           detail incl. my_contributions + is_participating
        - POST /challenges/{id}/join/      join (persistent-light)
        - POST /challenges/{id}/leave/     leave
        - GET  /challenges/my/             my joined challenges with progress
      tags:
      - challenges
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
          description: ''
  /api/challenges/{id}/:
    get:
      operationId: challenges_retrieve
      description: |-
        Reto/Challenge catalog: the General challenge + top-N keyword and journal
        challenges. A challenge is a lens over the global corpus, so its stats are a
        subset of the general ones and a single classification counts everywhere.

        - GET  /challenges/                list the catalog (filter with ?type=keyword|journal|general)
        - GET  /challenges/{id}/           detail incl. my_contributions + is_participating
        - POST /challenges/{id}/join/      join (persistent-light)
        - POST /challenges/{id}/leave/     leave
        - GET  /challenges/my/             my joined challenges with progress
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Challenge.
        required: true
      tags:
      - challenges
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/challenges/{id}/join/:
    post:
      operationId: challenges_join_create
      description: Join a challenge (idempotent).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Challenge.
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/challenges/{id}/leaderboard/:
    get:
      operationId: challenges_leaderboard_retrieve
      description: |-
        Ranking of users by number of valid classifications made within this
        challenge's scope. Profiles that opted into public visibility
        (`is_profile_public=True`) show their name; everyone else is 'Anonymous'.
        Always includes the caller's own count and position (`my_position`),
        even if outside the top `limit` (default 10).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Challenge.
        required: true
      tags:
      - challenges
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/challenges/{id}/leave/:
    post:
      operationId: challenges_leave_create
      description: Leave a challenge.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Challenge.
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/challenges/my/:
    get:
      operationId: challenges_my_retrieve
      description: Challenges the current user has joined, with live progress.
      tags:
      - challenges
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/classifications/:
    get:
      operationId: classifications_list
      description: |-
        ViewSet for classifications
        - Only authenticated users can access
        - Users can only see their own classifications
