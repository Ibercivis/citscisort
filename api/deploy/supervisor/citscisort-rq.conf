; CitSciSort RQ worker + scheduler (queue: citscisort_scheduler).
; Replace /path/to/citscisort with the absolute path of your checkout (and "user=" if needed).
; Install:
;   sudo cp deploy/supervisor/citscisort-rq.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
; Then register the recurring jobs (idempotent):
;   .venv/bin/python manage.py schedule_stats
;   .venv/bin/python manage.py schedule_engagement_emails

[program:citscisort-rq-worker]
command=/path/to/citscisort/api/.venv/bin/python /path/to/citscisort/api/manage.py rqworker citscisort_scheduler
directory=/path/to/citscisort/api
user=ubuntu
autostart=true
autorestart=true
environment=DJANGO_SETTINGS_MODULE=config.settings
stderr_logfile=/var/log/citscisort-rq-worker.err.log
stdout_logfile=/var/log/citscisort-rq-worker.out.log

[program:citscisort-rq-scheduler]
command=/path/to/citscisort/api/.venv/bin/python /path/to/citscisort/api/manage.py rqscheduler --queue citscisort_scheduler
directory=/path/to/citscisort/api
user=ubuntu
autostart=true
autorestart=true
environment=DJANGO_SETTINGS_MODULE=config.settings
stderr_logfile=/var/log/citscisort-rq-scheduler.err.log
stdout_logfile=/var/log/citscisort-rq-scheduler.out.log
